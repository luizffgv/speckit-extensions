name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # tags are needed to detect edits to released versions
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Validate extensions, workflows and steps
        run: uv run scripts/repo.py validate
      - name: Check catalogs are up to date
        run: uv run scripts/repo.py catalog --check

  release:
    # Every version listed in a catalog gets a tag (and, for extensions, a zip
    # asset) once it lands on main, so the catalog URLs resolve.
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Publish releases for new versions
        run: uv run scripts/repo.py release
        env:
          GH_TOKEN: ${{ github.token }}
