[project]
name = "speckit-extensions-repo"
version = "0.0.0"
description = "Tooling for this repository of Spec Kit extensions, workflows and workflow step types"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    # Validation runs Spec Kit's own manifest/workflow/step validators.
    # Bump this tag to validate against a newer Spec Kit.
    "specify-cli @ git+https://github.com/github/spec-kit.git@v1.3.3",
]

[tool.uv]
package = false
