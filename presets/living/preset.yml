schema_version: "1.0"

preset:
  id: "living"
  name: "Living Specs"
  version: "0.1.0"
  description: "Makes specify write the new living spec and its deltas to existing living specs in one step, and clarify, plan, tasks and analyze handle those deltas"
  author: "luizffgv"
  repository: "https://github.com/luizffgv/speckit-extensions"
  license: "Unlicense"

requires:
  speckit_version: ">=1.3.0"
  extensions:
    - "living"   # speckit.living.archive applies the deltas; speckit.living.delta re-runs them

provides:
  templates:
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Read existing living specs first, specify only the new capability, and record changes to living specs as deltas"
      strategy: "wrap"

    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "Don't ask what living specs already answer; record answers that change them as deltas"
      strategy: "wrap"

    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Read the delta targets and design the changes to them along with the new capability"
      strategy: "wrap"

    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Generate tasks for every delta item, referencing it by key"
      strategy: "wrap"

    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Check delta coverage, stale Was text and conflicts, keeping delta IDs apart from the spec's own"
      strategy: "wrap"

    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Adds the Changes to Living Specs section"
      strategy: "append"

tags:
  - "living-spec"
  - "delta"
  - "specify"
  - "tasks"
  - "analyze"
