schema_version: "1.0"

extension:
  id: living
  name: "Living Specs"
  version: "0.3.0"
  description: "Keep living specs in specs/living, one per capability: record which living specs a feature creates, updates and retires, then sync them once it ships, keeping feature directories as history"
  author: luizffgv
  repository: https://github.com/luizffgv/speckit-extensions
  license: Unlicense

requires:
  speckit_version: ">=1.3.0"
  tools:
    - name: git
      required: true

provides:
  commands:
    - name: speckit.living.delta
      file: commands/speckit.living.delta.md
      description: "Record which living specs a feature creates, updates (as deltas) and retires, in its spec.md, for sync to apply once the feature ships"
    - name: speckit.living.sync
      file: commands/speckit.living.sync.md
      description: "Sync a delivered feature into the living specs: create, update and retire specs/living/<name>/spec.md as its spec declares, and mark the feature directory as history"

hooks:
  after_clarify:
    command: speckit.living.delta
    optional: true
    prompt: "Refresh which living specs this feature creates, updates and retires?"
    description: "Re-check which living specs the clarified feature creates, updates and retires"

tags:
  - "living-spec"
  - "retention"
  - "sync"
  - "delta"
